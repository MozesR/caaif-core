name: Temporary v0.14 source bundle importer
on:
  push:
    branches:
      - research/v014-bounded-intent
    paths:
      - '.staging/v014.READY'
permissions:
  contents: write
jobs:
  import-verified-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify and expand v0.14 patch bundle
        shell: bash
        run: |
          set -euo pipefail
          cat .staging/v014.part* > "$RUNNER_TEMP/v014.b64"
          base64 --decode "$RUNNER_TEMP/v014.b64" > "$RUNNER_TEMP/v014.tar.xz"
          echo "6e09ff01d921ac664899f477da75424c6c627d9ae27f9ddafad8ad4c0d397597  $RUNNER_TEMP/v014.tar.xz" | sha256sum --check
          python3 - "$RUNNER_TEMP/v014.tar.xz" <<'PY'
          from pathlib import Path
          import sys, tarfile
          path = Path(sys.argv[1])
          with tarfile.open(path, "r:xz") as bundle:
              members = bundle.getmembers()
              for entry in members:
                  target = Path(entry.name)
                  if not entry.isfile() or target.is_absolute() or ".." in target.parts or not entry.name:
                      raise ValueError("unsafe_bundle_entry")
              bundle.extractall(".", filter="data")
          PY
          rm -f .staging/v014.part* .staging/v014.READY .github/workflows/v014-import.yml
          rmdir .staging
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Research: v0.14 bounded intent and opaque permits"
          git push origin HEAD:research/v014-bounded-intent
